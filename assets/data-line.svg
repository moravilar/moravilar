<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#A2D2FF"/>
      <stop offset="0.5" stop-color="#C8B6FF"/>
      <stop offset="1" stop-color="#FFC8DD"/>
    </linearGradient>
  </defs>
  <style>
    .line { fill:none; stroke:url(#g); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
            stroke-dasharray:1000; stroke-dashoffset:1000; animation:draw 6s ease-in-out infinite; }
    .dot { opacity:0; animation:pop 6s ease-in-out infinite; }
    .base { stroke:#3A3150; stroke-width:1; stroke-dasharray:4 6; }
    @keyframes draw { 0%{stroke-dashoffset:1000} 45%,80%{stroke-dashoffset:0} 100%{stroke-dashoffset:-1000} }
    @keyframes pop { 0%,100%{opacity:0} 50%,80%{opacity:1} }
  </style>
  <line class="base" x1="20" y1="75" x2="780" y2="75"/>
  <polyline class="line" points="20,60 95,48 170,55 245,30 320,42 395,22 470,38 545,18 620,34 695,14 780,26"/>
  <g class="dot">
    <circle cx="245" cy="30" r="4" fill="#A2D2FF"/>
    <circle cx="395" cy="22" r="4" fill="#C8B6FF"/>
    <circle cx="545" cy="18" r="4" fill="#DCC2F5"/>
    <circle cx="695" cy="14" r="4" fill="#FFC8DD"/>
  </g>
</svg>
